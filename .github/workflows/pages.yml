# Publishes the site to GitHub Pages with a freshly built station index.
# The index is built in CI and shipped in the Pages artifact rather than
# committed, so the repository does not grow by 4 MB every night.
#
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.

name: Deploy to Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * *"   # daily, after NOAA's overnight metadata refresh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build station index and place list
        run: |
          pip install "duckdb==1.5.6"   # pinned: 2.0 changed the Python API; test before moving up
          python scripts/build_station_index.py .

      - name: Fetch the latest records (built monthly by records.yml)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download records-latest -p records.tar.gz; then
            tar xzf records.tar.gz
          else
            echo "No records release yet; the site deploys without records."
          fi

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html styles.css app.js agent.js ghcnd.js format.js almanac.js annual.js config.js lumen-oauth.js station_index.parquet places.parquet img geo _site/
          if [ -d records ]; then cp -r records _site/; fi
          echo "{\"commit\": \"${GITHUB_SHA::7}\", \"built_at\": \"$(date -u +%Y-%m-%dT%H:%MZ)\"}" > _site/version.json

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
